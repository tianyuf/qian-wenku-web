{% extends "base.html" %}

{% block title %}内测登录 - 钱学森文库{% endblock %}
{% block meta %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block header_nav %}<span class="beta-badge">内测</span>{% endblock %}

{% block content %}
<main class="login-view" id="main">
    <section class="login-panel" aria-labelledby="login-title">
        <span class="section-kicker">内测访问</span>
        <h1 id="login-title">登录钱学森文库</h1>
        <p class="login-description">本站目前处于内测阶段，请输入访问口令继续。</p>
        {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
        <form method="post" class="login-form">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="filter-group">
                <label for="passphrase">访问口令</label>
                <input class="form-control" id="passphrase" name="passphrase" type="password" required autofocus autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">进入文库</button>
            <p class="login-access"><a href="mailto:info@qianxuesen.org">Need access?</a></p>
        </form>
    </section>
</main>
{% endblock %}
