<!DOCTYPE html>
<html lang="en" class="login-document">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Private beta access to the Qian Xuesen Archive">
    <meta name="robots" content="noindex, nofollow">
    <title>Beta Access - Qian Xuesen Archive</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <main class="login-page-content">
        <header>
            <h1>Qian Xuesen Archive</h1>
            <p><em>A Digital Research Collection</em></p>
        </header>

        <hr>

        <section aria-labelledby="login-title">
            <h2 id="login-title">Private Beta</h2>
            <p>This site is currently in private beta. Enter the access passphrase to continue.</p>
            {% if error %}<p class="login-error" role="alert"><strong>{{ error }}</strong></p>{% endif %}

            <div class="login-box">
                <form method="post" class="login-form">
                    <input type="hidden" name="next" value="{{ next_url }}">
                    <label for="passphrase">Access passphrase:</label>
                    <input id="passphrase" name="passphrase" type="password" required autofocus autocomplete="current-password">
                    <button type="submit">Enter the archive</button>
                    <p class="login-access"><a href="mailto:mail@qianxuesen.org">Need access?</a></p>
                </form>
            </div>
        </section>

        <hr>

        <footer>
            <p>Best viewed with any web browser.</p>
        </footer>
    </main>
</body>
</html>
