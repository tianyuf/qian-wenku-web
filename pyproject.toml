[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qian-wenku-web"
version = "0.1.0"
description = "Read-only public web viewer for prepared Qian Xuesen corpus artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Flask>=3.0,<4",
    "gunicorn>=22,<24",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.23"]
mcp = ["fastmcp>=2.10", "httpx>=0.27"]

[project.scripts]
qian-wenku-preflight = "qian_wenku_web.preflight:main"
qian-wenku-mcp = "qian_wenku_mcp.server:main"
qian-wenku-mcp-config = "qian_wenku_mcp.config:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qian_wenku_web = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
