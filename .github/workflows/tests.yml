name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python tests/create_fixture.py /tmp/qian-wenku-artifact
      - run: qian-wenku-preflight --artifact-dir /tmp/qian-wenku-artifact
      - run: python -m build
