upstream qian_wenku_web {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream qian_wenku_mcp {
    server 127.0.0.1:8100;
    keepalive 8;
}

# Rate limits are keyed on the real client address. Behind Cloudflare that
# requires the realip module configuration in cloudflare-real-ip.conf;
# without it every client would share a handful of Cloudflare edge buckets.
# The hosted MCP service calls the web API from 127.0.0.1 with the service
# token on behalf of many users, so loopback is exempt (an empty key is not
# counted).
map $remote_addr $wenku_client_key {
    default   $binary_remote_addr;
    127.0.0.1 "";
    ::1       "";
}

limit_req_zone $wenku_client_key zone=wenku_login:10m   rate=5r/m;
limit_req_zone $wenku_client_key zone=wenku_account:10m rate=30r/m;
limit_req_zone $wenku_client_key zone=wenku_search:10m  rate=2r/s;
limit_req_zone $wenku_client_key zone=wenku_api:10m     rate=2r/s;
limit_req_zone $wenku_client_key zone=wenku_mcp:10m     rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name wenku.qianxuesen.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wenku.qianxuesen.org;

    ssl_certificate /etc/letsencrypt/live/wenku.qianxuesen.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wenku.qianxuesen.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://dewey.tfang.info; connect-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Shared upstream headers. $remote_addr is the real client address once
    # the realip module has processed CF-Connecting-IP, so the app can trust
    # the CF-Connecting-IP it receives from nginx regardless of how the
    # request arrived.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(?:db|env|git|ini|log|pem|py|pyc|sqlite|sqlite3|toml|ya?ml)$ {
        deny all;
        return 404;
    }

    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://qian_wenku_web;
    }

    location = /login {
        limit_req zone=wenku_login burst=5 nodelay;
        proxy_pass http://qian_wenku_web;
    }

    # Account management, logout, admin console, favorites page.
    location ~ ^/(account|logout|admin|favorites)(/|$) {
        limit_req zone=wenku_account burst=20 nodelay;
        proxy_pass http://qian_wenku_web;
    }

    # HTMX search results and autocomplete: every call is a corpus scan.
    location ^~ /search/ {
        limit_req zone=wenku_search burst=20 nodelay;
        proxy_pass http://qian_wenku_web;
    }

    # JSON API (also used by the hosted MCP service from loopback, exempt above).
    location ^~ /api/ {
        limit_req zone=wenku_api burst=30 nodelay;
        proxy_pass http://qian_wenku_web;
    }

    # Hosted MCP endpoint (JSON-RPC over streamable HTTP).
    # Bearer-token auth is enforced by the MCP service itself; nginx just
    # forwards the Authorization header, which it passes by default.
    # The /mcp (no /rpc) page stays on the web app — it's the human guide.
    location = /mcp/rpc {
        limit_req zone=wenku_mcp burst=20 nodelay;
        proxy_pass http://qian_wenku_mcp;
        # MCP sessions and tool calls can be long-lived; disable buffering/timing out.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://qian_wenku_web;
        proxy_read_timeout 60s;
    }
}
