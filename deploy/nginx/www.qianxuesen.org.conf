server {
    listen 80;
    listen [::]:80;
    server_name qianxuesen.org www.qianxuesen.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qianxuesen.org;
    }

    location / {
        return 301 https://www.qianxuesen.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qianxuesen.org;

    ssl_certificate /etc/letsencrypt/live/www.qianxuesen.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.qianxuesen.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.qianxuesen.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.qianxuesen.org;

    root /var/www/qianxuesen.org;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.qianxuesen.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.qianxuesen.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location = /style.css {
        try_files /style.css =404;
    }

    location / {
        return 404;
    }
}
